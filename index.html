<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Statistics Encyclopedia</title>
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.45);
            --neon-blue: #0ea5e9;
            --neon-purple: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            /* إضاءة نيون خلفية متحركة وعميقة */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #090d1a 0%, #030712 100%);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* شبكة برمجية ناعمة جداً بالخلفية */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
        }

        /* الكارت الزجاجي الفخم */
        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 55px 45px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* بديل القفل: شعار برمجى ذكي متوهج وينبض بهدوء */
        .welcome-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            color: var(--neon-blue);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.1);
            animation: pulseBadge 2.5s infinite ease-in-out;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 20px rgba(14, 165, 233, 0.1); }
            50% { transform: scale(1.03); opacity: 1; box-shadow: 0 0 30px rgba(14, 165, 233, 0.3); }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            margin: 0 0 12px 0;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0 0 40px 0;
            font-weight: 400;
        }

        /* زر الدخول الخارق المطور */
        .explore-btn {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        /* خط بريق سينمائي أنيق على الزر */
        .explore-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: none;
            animation: shineEffect 3.5s infinite linear;
        }

        @keyframes shineEffect {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .explore-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 30px rgba(99, 102, 241, 0.4),
                0 0 20px rgba(14, 165, 233, 0.2);
        }

        .explore-btn:active {
            transform: translateY(-1px);
        }

        .arrow-svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            transition: transform 0.3s ease;
        }

        .explore-btn:hover .arrow-svg {
            transform: translateX(4px);
        }

        /* فوتر تقني مصغر أسفل الكارت */
        .system-status {
            margin-top: 35px;
            font-size: 0.75rem;
            color: rgba(148, 163, 184, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="welcome-badge">
            Platform Online
        </div>
        
        <h1>Statistics Encyclopedia</h1>
        <p>Step into the next-generation interactive learning hub tailored for advanced students.</p>

        <button type="button" class="explore-btn" onclick="enterHub()">
            <span>Explore Dashboard</span>
            <svg class="arrow-svg" viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <div class="system-status">
            <span class="status-dot"></span>
            <span>SYSTEM READY</span>
        </div>
    </div>

    <script>
        function enterHub() {
            // توجيه فوري ومباشر دون تعقيدات
            window.location.href = "main.html"; 
        }
    </script>
</body>
</html>
